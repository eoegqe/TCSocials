<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Official social media links for Theegget Creations.">
  <title>Socials | Theegget Creations</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #09090b; color: #f5f5f5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 0%, #24242b 0%, #111114 42%, #09090b 78%); }
    header { width: min(100% - 40px, 960px); margin: 0 auto; padding: 28px 0; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
    .monogram { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid #555; border-radius: 12px; font-weight: 800; letter-spacing: -2px; }
    .brand-name { font-size: 14px; font-weight: 650; letter-spacing: .01em; }
    main { width: min(100% - 40px, 680px); margin: auto; padding: 72px 0 96px; text-align: center; }
    .eyebrow { color: #a1a1aa; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 16px 0 12px; font-size: clamp(36px, 8vw, 58px); line-height: 1.05; letter-spacing: -.055em; }
    .intro { max-width: 470px; margin: 0 auto; color: #a1a1aa; font-size: 16px; line-height: 1.7; }
    .links { display: grid; gap: 14px; margin: 42px auto 0; max-width: 520px; }
    .social-link { display: flex; align-items: center; gap: 16px; padding: 19px 20px; border: 1px solid #34343a; border-radius: 16px; background: rgba(24,24,27,.78); color: #fafafa; text-align: left; text-decoration: none; transition: border-color .18s ease, transform .18s ease, background .18s ease; }
    .social-link:hover { border-color: #888; background: #202024; transform: translateY(-2px); }
    .youtube-icon { width: 44px; height: 44px; display: grid; place-items: center; flex: 0 0 44px; border-radius: 12px; background: #29292f; }
    .youtube-icon svg { width: 23px; height: 23px; fill: currentColor; }
    .link-copy { flex: 1; min-width: 0; }
    .link-title { display: block; font-size: 16px; font-weight: 700; }
    .link-handle { display: block; margin-top: 4px; color: #a1a1aa; font-size: 13px; }
    .arrow { color: #a1a1aa; font-size: 22px; }
    .home { display: inline-flex; align-items: center; justify-content: center; gap: 9px; margin-top: 30px; padding: 12px 18px; border: 1px solid #45454d; border-radius: 999px; color: #e4e4e7; font-size: 14px; font-weight: 650; text-decoration: none; transition: background .18s ease, border-color .18s ease; }
    .home:hover { background: #222228; border-color: #888; }
    footer { padding: 24px 20px 30px; color: #71717a; text-align: center; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="https://creations.theegget.com/" aria-label="Theegget Creations home">
      <span class="monogram" aria-hidden="true">TC</span>
      <span class="brand-name">Theegget Creations</span>
    </a>
  </header>
  <main>
    <div class="eyebrow">Theegget Creations</div>
    <h1>Find us online.</h1>
    <p class="intro">Official social media links for Theegget Creations. Follow our channels and keep up with what we're creating.</p>
    <section class="links" aria-label="Official social media accounts">
      <a class="social-link" href="https://www.youtube.com/@TheeggetC" target="_blank" rel="noopener noreferrer">
        <span class="youtube-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>
        </span>
        <span class="link-copy">
          <span class="link-title">YouTube</span>
          <span class="link-handle">@TheeggetC · Official channel</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>
    <a class="home" href="https://creations.theegget.com/"><span aria-hidden="true">←</span> Back to Creations</a>
  </main>
  <footer>© <span id="year"></span> Theegget Creations</footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
